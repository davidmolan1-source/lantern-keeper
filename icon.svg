<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#FFEED4"/>
      <stop offset="55%" stop-color="#FFCFA0"/>
      <stop offset="100%" stop-color="#FFA070"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A5FA0"/>
      <stop offset="100%" stop-color="#3A2342"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFE89C" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFE89C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glass" cx="50%" cy="55%" r="58%">
      <stop offset="0%" stop-color="#FFF2C8"/>
      <stop offset="100%" stop-color="#FFC480"/>
    </radialGradient>
    <radialGradient id="f-yellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6BB"/>
      <stop offset="100%" stop-color="#FFD23F"/>
    </radialGradient>
    <radialGradient id="f-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD2DD"/>
      <stop offset="100%" stop-color="#FF7FA0"/>
    </radialGradient>
    <radialGradient id="f-teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5F0EB"/>
      <stop offset="100%" stop-color="#4FCFC2"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- warm halo behind the lantern -->
  <circle cx="512" cy="540" r="430" fill="url(#glow)"/>

  <!-- handle -->
  <path d="M 432 248 C 432 170 592 170 592 248"
        stroke="#5A3A6B" stroke-width="26" fill="none" stroke-linecap="round"/>

  <!-- top cap -->
  <rect x="470" y="244" width="84" height="42" rx="12" fill="#5A3A6B"/>

  <!-- body -->
  <rect x="290" y="282" width="444" height="528" rx="76" fill="url(#body)"/>

  <!-- glass / interior glow -->
  <rect x="342" y="334" width="340" height="424" rx="48" fill="url(#glass)"/>

  <!-- three flames -->
  <ellipse cx="406" cy="610" rx="40" ry="100" fill="url(#f-yellow)"/>
  <ellipse cx="512" cy="610" rx="40" ry="100" fill="url(#f-pink)"/>
  <ellipse cx="618" cy="610" rx="40" ry="100" fill="url(#f-teal)"/>

  <!-- inner brighter cores -->
  <ellipse cx="406" cy="595" rx="18" ry="62" fill="#FFFADE" opacity="0.85"/>
  <ellipse cx="512" cy="595" rx="18" ry="62" fill="#FFEAF0" opacity="0.85"/>
  <ellipse cx="618" cy="595" rx="18" ry="62" fill="#E0F7F4" opacity="0.85"/>

  <!-- base of lantern -->
  <rect x="290" y="776" width="444" height="34" rx="14" fill="#2A1830"/>

  <!-- a small star above -->
  <path d="M 770 200 L 780 230 L 810 240 L 780 250 L 770 280 L 760 250 L 730 240 L 760 230 Z"
        fill="#FFE066"/>
</svg>
